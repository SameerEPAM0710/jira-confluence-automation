name: northstar-prototype

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: northstar
      POSTGRES_USER: northstar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local environment before starting Compose}
    volumes:
      - northstar-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U northstar -d northstar"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: apps/api
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3001
      DATA_MODE: postgres
      DATABASE_URL: postgres://northstar@postgres:5432/northstar
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local environment before starting Compose}
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    environment:
      VITE_API_PROXY_TARGET: http://api:3001
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  northstar-postgres: